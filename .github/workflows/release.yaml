name: Choria Release
on:
  push:
    tags:
      - '*'

jobs:
  el_64:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        uses: choria-io/actions/packager@main
        with:
          build_package: el_64
          packager_tag: el-go1.26
          version: tag

  el_ppc64le:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        uses: choria-io/actions/packager@main
        with:
          build_package: el_ppc64le
          packager_tag: el-go1.26
          version: tag

  el_aarch64:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        uses: choria-io/actions/packager@main
        with:
          build_package: el_aarch64
          packager_tag: el-go1.26
          version: tag

  upload:
    needs:
      - el_ppc64le
      - el_aarch64
      - el_64

    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      
      - name: Artifacts normalization
        shell: bash
        run: |
          cd artifacts
          for i in foss*
          do
            mv -v $i $(echo $i|cut -d_ -f2-)
          done

      - name: Upload artifacts to Spaces
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --endpoint=https://ams3.digitaloceanspaces.com --acl authenticated-read
        env:
          AWS_S3_BUCKET: choria-packages-ams
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          SOURCE_DIR: artifacts/foss
          DEST_DIR: release
